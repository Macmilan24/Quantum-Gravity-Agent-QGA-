[project]
name = "qga-core"
version = "0.1.0"
description = "Multi-agent Quantum Gravity Hypothesis Generator"
authors = [
    {name = "Macmilan24",email = "cpt.macmilan24@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "langgraph (>=1.0.5,<2.0.0)",
    "langchain-google-genai (>=4.1.2,<5.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "langchain-core (>=1.2.5,<2.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "arxiv (>=2.3.1,<3.0.0)",
    "pypdf (>=6.5.0,<7.0.0)",
    "colorlog (>=6.10.1,<7.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "langchain-openai (>=1.1.6,<2.0.0)",
    "fastapi (>=0.127.0,<0.128.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "numpy (>=2.4.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
